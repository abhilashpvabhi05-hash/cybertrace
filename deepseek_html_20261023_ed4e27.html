<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberTrace · Vehicle Number Lookup</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Courier New', 'Consolas', 'Monaco', monospace;
    }

    :root {
      --bg-dark: #050505;
      --bg-panel: #0b0b0b;
      --bg-card: #0f0f0f;
      --red: #ff1a1a;
      --red-dim: #a10000;
      --red-glow: rgba(255, 26, 26, 0.6);
      --red-soft: rgba(255, 26, 26, 0.1);
      --gray: #1a1a1a;
      --gray-light: #2a2a2a;
      --text-dim: #777;
      --text-soft: #aaa;
    }

    body {
      background: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
      position: relative;
      color: #ddd;
      font-family: 'Courier New', monospace;
    }

    /* ===== MATRIX RAIN BACKGROUND ===== */
    #matrixCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.12;
      pointer-events: none;
    }

    /* ===== SCANLINE OVERLAY ===== */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 1;
      animation: scanMove 8s linear infinite;
    }

    @keyframes scanMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(30px); }
    }

    /* ===== MAIN CONTAINER ===== */
    .container {
      max-width: 920px;
      width: 100%;
      background: linear-gradient(160deg, #0c0c0c 0%, #050505 100%);
      border-radius: 2.2rem;
      padding: 2.5rem 2rem;
      position: relative;
      z-index: 2;
      border: 1px solid #222;
      box-shadow:
        0 0 0 1px rgba(255, 26, 26, 0.08),
        0 25px 60px -20px rgba(255, 0, 0, 0.15),
        0 0 120px -30px rgba(255, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      animation: containerIn 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
      transition: box-shadow 0.4s;
    }

    .container:hover {
      box-shadow:
        0 0 0 1px rgba(255, 26, 26, 0.15),
        0 25px 60px -20px rgba(255, 0, 0, 0.25),
        0 0 140px -30px rgba(255, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    @keyframes containerIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Corner brackets decoration */
    .container::before,
    .container::after {
      content: '';
      position: absolute;
      width: 30px;
      height: 30px;
      border: 2px solid var(--red);
      opacity: 0.5;
      transition: all 0.3s;
    }

    .container::before {
      top: 12px;
      left: 12px;
      border-right: none;
      border-bottom: none;
      border-radius: 4px 0 0 0;
    }

    .container::after {
      bottom: 12px;
      right: 12px;
      border-left: none;
      border-top: none;
      border-radius: 0 0 4px 0;
    }

    .container:hover::before,
    .container:hover::after {
      opacity: 1;
      width: 40px;
      height: 40px;
      box-shadow: 0 0 15px var(--red-glow);
    }

    @media (max-width: 600px) {
      body { padding: 1rem; }
      .container { padding: 1.8rem 1.2rem; border-radius: 1.6rem; }
    }

    /* ===== HEADER ===== */
    .header {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 2rem;
    }

    .logo-icon {
      width: 3.4rem;
      height: 3.4rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      color: var(--red);
      background: #0f0f0f;
      border: 1px solid #330000;
      box-shadow:
        0 0 20px rgba(255, 0, 0, 0.2),
        inset 0 0 20px rgba(255, 0, 0, 0.05);
      position: relative;
      animation: iconGlitch 4s infinite;
    }

    @keyframes iconGlitch {
      0%, 90%, 100% { transform: translate(0, 0); filter: drop-shadow(0 0 8px rgba(255, 0, 0, 0.6)); }
      92% { transform: translate(-2px, 1px); filter: drop-shadow(0 0 12px rgba(255, 0, 0, 1)); }
      94% { transform: translate(2px, -1px); }
      96% { transform: translate(-1px, -2px); }
      98% { transform: translate(1px, 2px); }
    }

    .logo-icon i {
      animation: iconPulse 2s infinite alternate;
    }

    @keyframes iconPulse {
      from { opacity: 0.85; }
      to { opacity: 1; text-shadow: 0 0 12px var(--red); }
    }

    .header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #f0f0f0;
      position: relative;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
    }

    .header h1 span {
      display: block;
      margin-top: 0.3rem;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 3px;
      color: var(--red);
      text-transform: uppercase;
      opacity: 0.8;
      animation: blinkText 2.5s infinite;
    }

    @keyframes blinkText {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.4; }
    }

    /* Glitch text effect on title */
    .header h1::before,
    .header h1::after {
      content: 'CyberTrace';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.6;
      pointer-events: none;
    }

    .header h1::before {
      color: #ff1a1a;
      z-index: -1;
      animation: glitchBefore 3s infinite;
    }

    .header h1::after {
      color: #00e5ff;
      z-index: -2;
      animation: glitchAfter 3s infinite;
    }

    @keyframes glitchBefore {
      0%, 90%, 100% { transform: translate(0); opacity: 0; }
      92% { transform: translate(-3px, 0); opacity: 0.7; }
      94% { transform: translate(3px, 0); opacity: 0.7; }
      96% { transform: translate(-2px, 0); opacity: 0.7; }
    }

    @keyframes glitchAfter {
      0%, 90%, 100% { transform: translate(0); opacity: 0; }
      93% { transform: translate(3px, 0); opacity: 0.5; }
      95% { transform: translate(-3px, 0); opacity: 0.5; }
      97% { transform: translate(2px, 0); opacity: 0.5; }
    }

    /* ===== SEARCH CARD ===== */
    .search-card {
      background: #0a0a0a;
      border: 1px solid #1f1f1f;
      border-radius: 1.4rem;
      padding: 1.8rem;
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .search-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--red), transparent);
      animation: scanLine 3s infinite linear;
    }

    @keyframes scanLine {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .search-card:focus-within {
      border-color: #3a0000;
      box-shadow: 0 0 30px -10px rgba(255, 0, 0, 0.25);
    }

    .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }

    .input-wrapper {
      flex: 1 1 260px;
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--red);
      font-size: 1.1rem;
      pointer-events: none;
      animation: iconPulse 2s infinite alternate;
    }

    /* Typing cursor on input */
    .input-wrapper::after {
      content: '_';
      position: absolute;
      right: 1.4rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--red);
      font-size: 1.4rem;
      font-weight: 700;
      animation: cursorBlink 1s infinite;
      opacity: 0;
    }

    .input-wrapper:focus-within::after {
      opacity: 1;
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    #vehicleInput {
      width: 100%;
      padding: 1.1rem 2.5rem 1.1rem 3.2rem;
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 2px;
      background: #050505;
      border: 1.5px solid #222;
      border-radius: 12px;
      outline: none;
      color: var(--red);
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
      caret-color: var(--red);
    }

    #vehicleInput::placeholder {
      color: #444;
      font-weight: 400;
      letter-spacing: 1.5px;
      text-transform: none;
      font-style: italic;
    }

    #vehicleInput:focus {
      border-color: var(--red-dim);
      background: #080000;
      box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.1), inset 0 0 20px rgba(255, 0, 0, 0.05);
    }

    /* ===== SEARCH BUTTON ===== */
    .btn-search {
      background: transparent;
      border: 1.5px solid var(--red);
      color: var(--red);
      padding: 1.1rem 2.2rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
      white-space: nowrap;
      flex: 0 0 auto;
      letter-spacing: 2px;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      box-shadow: 0 0 15px -5px rgba(255, 0, 0, 0.3);
    }

    .btn-search::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 0, 0, 0.15), transparent);
      transition: left 0.5s;
    }

    .btn-search:hover::before {
      left: 100%;
    }

    .btn-search:hover {
      background: var(--red);
      color: #000;
      box-shadow: 0 0 30px -5px rgba(255, 0, 0, 0.7), 0 0 60px -15px rgba(255, 0, 0, 0.5);
      transform: translateY(-2px);
      border-color: var(--red);
    }

    .btn-search:hover i {
      animation: iconSpin 0.6s ease;
    }

    @keyframes iconSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .btn-search:active {
      transform: translateY(1px) scale(0.97);
      box-shadow: 0 0 15px -5px rgba(255, 0, 0, 0.5);
    }

    .btn-search:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ===== VALIDATION MESSAGE ===== */
    .validation-msg {
      margin-top: 0.9rem;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding-left: 0.5rem;
      color: var(--red);
      font-weight: 600;
      min-height: 1.6rem;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
    }

    .validation-msg:not(:empty) {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .validation-msg i {
      font-size: 0.9rem;
      animation: pulseError 1s infinite alternate;
    }

    @keyframes pulseError {
      from { opacity: 0.6; transform: scale(1); }
      to { opacity: 1; transform: scale(1.15); text-shadow: 0 0 10px var(--red); }
    }

    /* ===== LOADER ===== */
    .loader {
      display: none;
      justify-content: center;
      align-items: center;
      gap: 0.9rem;
      margin: 1.2rem 0 0.5rem;
      color: var(--red);
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 0.85rem;
      animation: fadeIn 0.3s;
    }

    .loader.active {
      display: flex;
    }

    .spinner {
      width: 1.8rem;
      height: 1.8rem;
      border: 3px solid #330000;
      border-top: 3px solid var(--red);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ===== DETAILS SECTION ===== */
    .details-section {
      background: #080808;
      border: 1px solid #1a1a1a;
      border-radius: 1.4rem;
      padding: 2rem 1.8rem;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s;
    }

    .details-section:hover {
      border-color: #2a0000;
    }

    .details-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: linear-gradient(180deg, transparent, var(--red), transparent);
      opacity: 0.6;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 1.6rem;
      color: #e0e0e0;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
    }

    .section-title i {
      font-size: 1.3rem;
      color: var(--red);
      animation: softBounce 2s infinite;
      filter: drop-shadow(0 0 8px var(--red-glow));
    }

    @keyframes softBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    /* Blinking status dot */
    .section-title::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      margin-left: auto;
      box-shadow: 0 0 10px var(--red);
      animation: dotBlink 1.5s infinite;
    }

    @keyframes dotBlink {
      0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--red); }
      50% { opacity: 0.3; box-shadow: 0 0 3px var(--red); }
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.4rem 2rem;
    }

    @media (max-width: 480px) {
      .details-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      border-bottom: 1px dashed #1e1e1e;
      padding-bottom: 0.7rem;
      transition: all 0.25s;
      animation: slideUp 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) backwards;
      position: relative;
    }

    .detail-item:hover {
      border-bottom-color: var(--red-dim);
      transform: translateX(3px);
    }

    .detail-item:nth-child(1) { animation-delay: 0.03s; }
    .detail-item:nth-child(2) { animation-delay: 0.06s; }
    .detail-item:nth-child(3) { animation-delay: 0.09s; }
    .detail-item:nth-child(4) { animation-delay: 0.12s; }
    .detail-item:nth-child(5) { animation-delay: 0.15s; }
    .detail-item:nth-child(6) { animation-delay: 0.18s; }
    .detail-item:nth-child(7) { animation-delay: 0.21s; }
    .detail-item:nth-child(8) { animation-delay: 0.24s; }
    .detail-item:nth-child(9) { animation-delay: 0.27s; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .detail-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.2s;
    }

    .detail-item:hover .detail-label {
      color: var(--red);
    }

    .detail-label i {
      font-size: 0.75rem;
      width: 1.1rem;
      color: var(--red-dim);
      transition: all 0.25s;
    }

    .detail-item:hover .detail-label i {
      color: var(--red);
      transform: scale(1.2);
      filter: drop-shadow(0 0 5px var(--red-glow));
    }

    .detail-value {
      font-size: 1.05rem;
      font-weight: 600;
      color: #ddd;
      word-break: break-word;
      padding-left: 1.6rem;
      min-height: 1.7rem;
      display: flex;
      align-items: center;
      letter-spacing: 1px;
      transition: color 0.2s, text-shadow 0.2s;
    }

    .detail-item:hover .detail-value {
      color: #fff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.1);
    }

    .detail-value.placeholder {
      color: #3a3a3a;
      font-weight: 400;
      font-style: italic;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    /* ===== MESSAGE BOX ===== */
    .message-box {
      background: linear-gradient(90deg, #1a0000 0%, #0d0000 100%);
      border-radius: 10px;
      padding: 1.1rem 1.4rem;
      margin-top: 1.8rem;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      color: #ff8888;
      border-left: 4px solid var(--red);
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 1px;
      animation: popIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1), 
                 glowMessage 1.8s infinite alternate;
      box-shadow: 0 0 30px -10px rgba(255, 0, 0, 0.4);
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes glowMessage {
      from { border-left-color: var(--red-dim); box-shadow: 0 0 30px -10px rgba(255, 0, 0, 0.3); }
      to { border-left-color: var(--red); box-shadow: 0 0 40px -8px rgba(255, 0, 0, 0.6); }
    }

    .message-box i {
      font-size: 1.3rem;
      color: var(--red);
      animation: iconPulse 1.5s infinite alternate;
    }

    .demo-badge {
      background: var(--red);
      color: #000;
      border-radius: 4px;
      padding: 0.25rem 0.7rem;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      animation: badgePulse 2s infinite alternate;
      font-family: 'Courier New', monospace;
    }

    @keyframes badgePulse {
      from { opacity: 0.8; box-shadow: 0 0 5px var(--red); }
      to { opacity: 1; box-shadow: 0 0 15px var(--red); }
    }

    .demo-badge i {
      font-size: 0.65rem;
      animation: none;
      color: #000;
    }

    /* ===== FOOTER ===== */
    .footer-note {
      margin-top: 1.4rem;
      font-size: 0.7rem;
      text-align: center;
      color: #333;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: 'Courier New', monospace;
      transition: color 0.3s;
    }

    .footer-note:hover {
      color: var(--red);
    }

    .footer-note i {
      animation: spinSlow 6s infinite linear;
      display: inline-block;
      color: var(--red-dim);
      margin-right: 0.3rem;
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ===== HIDDEN ===== */
    .hidden {
      display: none !important;
    }

    /* ===== FADE IN ===== */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="logo-icon">
      <i class="fas fa-car-side"></i>
    </div>
    <h1>
      CyberTrace
      <span>&lt; vehicle number lookup &gt;</span>
    </h1>
  </div>

  <!-- Search card -->
  <div class="search-card">
    <div class="input-group">
      <div class="input-wrapper">
        <i class="fas fa-map-pin"></i>
        <input type="text" id="vehicleInput" placeholder="e.g. KL14AB1234" maxlength="12" autocomplete="off">
      </div>
      <button class="btn-search" id="searchBtn">
        <i class="fas fa-search"></i> Search
      </button>
    </div>
    <div class="validation-msg" id="validationMsg"></div>
    <!-- Loader -->
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <span>Scanning database…</span>
    </div>
  </div>

  <!-- Vehicle details section -->
  <div class="details-section">
    <div class="section-title">
      <i class="fas fa-clipboard-list"></i>
      Vehicle Details
    </div>

    <div class="details-grid" id="detailsGrid">
      <div class="detail-item">
        <div class="detail-label"><i class="fas fa-id-card"></i> Registration No.</div>
        <div class="detail-value placeholder" id="regNo">—</div>
      </div>
      <div class="detail-item">
        <div class="detail-label"><i class="fas fa-building"></i> Company</div>
        <div class="detail-value placeholder" id="company">—</div>
      </div>
      <div class="detail-item">
        <div class="detail-label"><i class="fas fa-car"></i> Model</div>
        <div class="detail-value placeholder" id="model">—</div>
      </div>
      <div class="detail-item">
        <div class="detail-label"><i class="fas fa-truck"></i> Vehicle Type</div>
        <div class="detail-value placeholder" id="vType">—</div>
      </div>
      <div class="detail-item">
        <div class="detail-label"><i class="fas fa-gas-pump"></i> Fuel Type</div>
        <div class="detail-value placeholder" id="fuel">—</div>
      </div>
      <div class="detail-item">
        <div class="detail-label"><i class="fas fa-calendar-alt"></i> Registration Date</div>
        <div class="detail-value placeholder" id="regDate">—</div>
      </div>
      <div class="detail-item">
        <div class="detail-label"><i class="fas fa-map-marker-alt"></i> RTO</div>
        <div class="detail-value placeholder" id="rto">—</div>
      </div>
      <div class="detail-item">
        <div class="detail-label"><i class="fas fa-flag"></i> State</div>
        <div class="detail-value placeholder" id="state">—</div>
      </div>
      <div class="detail-item">
        <div class="detail-label"><i class="fas fa-check-circle"></i> Registration Status</div>
        <div class="detail-value placeholder" id="status">—</div>
      </div>
    </div>

    <!-- Message area (Vehicle DB not connected) -->
    <div class="message-box hidden" id="messageBox">
      <i class="fas fa-database"></i>
      <span>Vehicle database is not connected yet.</span>
      <span class="demo-badge"><i class="fas fa-flask"></i> Demo</span>
    </div>
  </div>

  <div class="footer-note">
    <i class="fas fa-shield-alt"></i> Format: KL14AB1234 · No backend used
  </div>
</div>

<script>
  /* ===== MATRIX RAIN ===== */
  (function matrixRain() {
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$+-*/=%""\'#&_(),.;:?!\\|{}<>[]^~';
    const fontSize = 14;
    let columns = Math.floor(width / fontSize);
    const drops = Array(columns).fill(1);

    function draw() {
      ctx.fillStyle = 'rgba(5, 5, 5, 0.08)';
      ctx.fillRect(0, 0, width, height);

      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        if (Math.random() > 0.97) {
          ctx.fillStyle = '#ff4d4d';
          ctx.shadowColor = '#ff0000';
          ctx.shadowBlur = 8;
        } else {
          ctx.fillStyle = '#8b0000';
          ctx.shadowColor = 'transparent';
          ctx.shadowBlur = 0;
        }

        ctx.fillText(text, x, y);
        ctx.shadowBlur = 0;

        if (y > height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    setInterval(draw, 60);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      columns = Math.floor(width / fontSize);
      drops.length = 0;
      for (let i = 0; i < columns; i++) drops.push(1);
    });
  })();

  /* ===== VEHICLE LOOKUP LOGIC ===== */
  (function() {
    const input = document.getElementById('vehicleInput');
    const searchBtn = document.getElementById('searchBtn');
    const validationMsg = document.getElementById('validationMsg');
    const loader = document.getElementById('loader');
    const messageBox = document.getElementById('messageBox');

    const regNoEl = document.getElementById('regNo');
    const companyEl = document.getElementById('company');
    const modelEl = document.getElementById('model');
    const vTypeEl = document.getElementById('vType');
    const fuelEl = document.getElementById('fuel');
    const regDateEl = document.getElementById('regDate');
    const rtoEl = document.getElementById('rto');
    const stateEl = document.getElementById('state');
    const statusEl = document.getElementById('status');

    const detailValues = [regNoEl, companyEl, modelEl, vTypeEl, fuelEl, regDateEl, rtoEl, stateEl, statusEl];

    // Indian vehicle registration regex
    const VEHICLE_REGEX = /^[A-Z]{2}[0-9]{2}[A-Z]{1,3}[0-9]{4}$/;

    function resetDetails() {
      detailValues.forEach(el => {
        el.textContent = '—';
        el.classList.add('placeholder');
      });
    }

    function clearUI() {
      validationMsg.innerHTML = '';
      messageBox.classList.add('hidden');
    }

    function setValidationError(msg) {
      validationMsg.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${msg}`;
    }

    function clearValidation() {
      validationMsg.innerHTML = '';
    }

    function performSearch() {
      const rawValue = input.value.trim().toUpperCase();

      clearUI();
      loader.classList.remove('active');

      if (!rawValue) {
        setValidationError('Please enter a vehicle registration number.');
        resetDetails();
        input.focus();
        return;
      }

      if (!VEHICLE_REGEX.test(rawValue)) {
        setValidationError('Invalid format. Use: KL14AB1234');
        resetDetails();
        input.focus();
        return;
      }

      loader.classList.add('active');
      searchBtn.disabled = true;

      setTimeout(() => {
        loader.classList.remove('active');
        searchBtn.disabled = false;

        resetDetails();
        regNoEl.textContent = rawValue;
        regNoEl.classList.remove('placeholder');

        messageBox.classList.remove('hidden');
        clearValidation();
        input.blur();
      }, 900);
    }

    searchBtn.addEventListener('click', performSearch);

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        performSearch();
      }
    });

    input.addEventListener('input', function() {
      clearValidation();
      messageBox.classList.add('hidden');
      resetDetails();
      this.value = this.value.toUpperCase();
    });

    input.addEventListener('blur', function() {
      this.value = this.value.trim().toUpperCase();
    });

    resetDetails();
    clearUI();
  })();
</script>
</body>
</html>
